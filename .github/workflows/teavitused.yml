# Meeldetuletused iga 15 minuti järel.
# Verceli tasuta pakett lubab ajastatud tööd ainult kord päevas, seega käivitab neid GitHub.
# Vaja on repo saladusi (Settings → Secrets and variables → Actions):
#   APP_URL      – nt https://aegly.vercel.app
#   CRON_SECRET  – sama väärtus mis Verceli keskkonnamuutujas CRON_SECRET
name: Teavitused
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Käivita meeldetuletused
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL või CRON_SECRET puudub – jätan vahele"; exit 0; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/teavitused"
